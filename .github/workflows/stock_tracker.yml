name: uneri-tracker

# スケジュールは UTC。日本は夏時間がないため、この対応は通年で固定。
# 朝  JST 平日 08:30 = UTC 23:30（日〜木）
# 夕  JST 平日 16:00 = UTC 07:00（月〜金）
# 週末 JST 土曜 10:00 = UTC 01:00（土）
on:
  schedule:
    - cron: "30 23 * * 0-4"
    - cron: "0 7 * * 1-5"
    - cron: "0 1 * * 6"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "実行モード"
        required: true
        default: evening
        type: choice
        options:
          - morning
          - evening
          - weekend

concurrency:
  group: uneri-tracker-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 依存パッケージをインストール
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: RUN_MODE を決定
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.run_mode }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="$INPUT_MODE"
          elif [ "$EVENT_SCHEDULE" = "30 23 * * 0-4" ]; then
            MODE="morning"
          elif [ "$EVENT_SCHEDULE" = "0 7 * * 1-5" ]; then
            MODE="evening"
          elif [ "$EVENT_SCHEDULE" = "0 1 * * 6" ]; then
            MODE="weekend"
          else
            MODE="evening"
          fi
          case "$MODE" in
            morning|evening|weekend) ;;
            *) MODE="evening" ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "RUN_MODE=$MODE"

      - name: ウォッチリストが無ければ楽天CSVから移行
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "data/watchlist_tracker.csv" ]; then
            python scripts/migrate_rakuten_csv.py
          fi

      - name: 株価追跡を実行
        shell: bash
        env:
          RUN_MODE: ${{ steps.mode.outputs.mode }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          PAGES_URL: ${{ secrets.PAGES_URL }}
          TZ: Asia/Tokyo
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: utf-8
        run: python scripts/daily_tracker.py

      - name: GitHub Pages 用アーティファクトをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 追跡データをコミット
        shell: bash
        run: |
          set -euo pipefail
          git add -- "data/watchlist_tracker.csv" "docs/watchlist_tracker.csv" "data/latest_summary.json" "docs/latest_summary.json"
          if git diff --cached --quiet; then
            echo "コミットする変更はありません"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: update stock tracker snapshot [skip ci]"
            git push
          fi

  deploy:
    needs: track
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages を構成
        uses: actions/configure-pages@v5

      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
